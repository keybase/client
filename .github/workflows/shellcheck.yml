name: Shellcheck packaging scripts
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'shared/react-native/gobuild.sh'
      - 'shared/react-native/packageAndBuild.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches: [master]
    paths:
      - 'packaging/**'
      - 'shared/react-native/gobuild.sh'
      - 'shared/react-native/packageAndBuild.sh'
      - '.github/workflows/shellcheck.yml'
permissions:
  contents: read
jobs:
  shellcheck:
    name: shellcheck packaging scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Run shellcheck
      # Run from the repo root: the `# shellcheck source=` directives are
      # relative to it.
      run: |
        shellcheck --version
        git ls-files -z -- 'packaging/*.sh' shared/react-native/gobuild.sh shared/react-native/packageAndBuild.sh \
          | xargs -0 shellcheck -S warning -x
