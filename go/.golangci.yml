version: '2'

run:
  timeout: 15m
  tests: true

formatters:
  exclusions:
    generated: lax
    paths:
      - prot.go # AVDL-generated protocol bindings
      - cmd_wallet.*.go # Stellar wallet CLI commands
      - protocol # Generated RPC protocol package
      - third_party$
      - builtin$
      - kbfs/dokan # Windows-specific FUSE implementation, not maintained
      - kbfs/kbfsdokan # Windows-specific FUSE implementation, not maintained
      - kbfs/libdokan # Windows-specific FUSE implementation, not maintained
  enable:
    - gofmt
    - gofumpt

linters:
  exclusions:
    generated: lax
    # golangci-lint built-in exclusion presets (common false positives).
    presets:
      - comments # Missing comments on exported identifiers
      - common-false-positives # Known noisy checks across linters
      - legacy # Deprecated default exclusions kept for compatibility
      - std-error-handling # Unchecked errors on Close/Flush/stdout/stderr
    paths:
      - prot.go # AVDL-generated protocol bindings
      - cmd_wallet.*.go # Stellar wallet CLI commands
      - protocol # Generated RPC protocol package
      - third_party$
      - builtin$
      - examples$
      - kbfs/dokan # Windows-specific FUSE implementation, not maintained
      - kbfs/kbfsdokan # Windows-specific FUSE implementation, not maintained
      - kbfs/libdokan # Windows-specific FUSE implementation, not maintained
      - kbfs/test/engine_fs_test.go # Test framework - interface methods required even if unused
      - kbfs/libkbfs/protected_context.go # Test hook - method overridden in tests
    rules:
      # Tests only: gosec is noisy on fixtures, temp paths, and non-crypto RNG.
      - path: _test\.go$
        text: "G101:" # Look for hardcoded credentials
      - path: _test\.go$
        text: "G703:" # Path traversal via taint analysis
      - path: _test\.go$
        text: "G404:" # Insecure random number source (rand)
  enable:
    - gocritic
    - unconvert
    - revive
    - govet
    - ineffassign
    - unused
    - staticcheck
    - misspell
    - bodyclose
    - errcheck
    - gosec
    - testifylint

  settings:
    gocritic:
      disabled-checks:
        - ifElseChain # Long if-else chains should be rewritten as switch
        - elseif # Nested if should be merged into else-if

    gosec:
      # These exploded after the gosec upgrade with mostly false positives
      # (protocol enum conversions, fire-and-forget goroutines, SSA slice indexes).
      excludes:
        - G115 # Type conversion which leads to integer overflow
        - G118 # Context propagation failure leading to goroutine/resource leaks
        - G602 # Possible slice bounds out of range

    govet:
      enable-all: true
      disable:
        - shadow # Declaration of a variable that shadows another
        - fieldalignment # Struct fields are not aligned for minimal size

    staticcheck:
      checks:
        - 'all'
        - '-ST1000' # Incorrect or missing package comment
        - '-ST1003' # Poorly chosen identifier (Db vs DB, etc.)
        - '-ST1005' # Incorrectly formatted error string
        - '-ST1016' # Use consistent method receiver names
        - '-ST1020' # The documentation of an exported function should start with the function name

    revive:
      enable-all-rules: false
      rules:
        # Disabled rules
        - name: unused-parameter # Function parameter is unused
          disabled: true
        - name: error-strings # Error strings should not be capitalized or end with punctuation
          disabled: true
        - name: exported # Exported identifier should have a comment
          disabled: true
        - name: package-comments # Package should have a package comment
          disabled: true
        - name: var-naming # Variable naming does not match initialisms / style
          disabled: true

        # Enabled rules
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
